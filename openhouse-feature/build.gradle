plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.wuxianpi.openhouse.feature"
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 28
        consumerProguardFiles "consumer-rules.pro"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = "17" }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    api project(":openhouse-core")
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"
    implementation "androidx.viewpager:viewpager:1.1.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "androidx.test:core:1.6.1"
    testImplementation "org.robolectric:robolectric:4.14.1"
}

def openHouseGuideUrl = "https://app.webefficacy.com/guide/"
def openHouseGuideSnapshot = file("src/main/assets/openhouse/guide/index.html")

tasks.register("syncOpenHouseGuideSnapshot") {
    description = "Save the current online OpenHouse guide as the APK offline snapshot."
    outputs.file(openHouseGuideSnapshot)
    outputs.upToDateWhen { false }

    doLast {
        openHouseGuideSnapshot.parentFile.mkdirs()
        try {
            def connection = new URI(openHouseGuideUrl).toURL().openConnection()
            connection.connectTimeout = 5000
            connection.readTimeout = 10000
            connection.setRequestProperty("User-Agent", "OpenHouse-Android-Build")
            def html = connection.inputStream.getText("UTF-8")
            if (html.trim().isEmpty()) throw new GradleException("Online OpenHouse guide is empty")
            def temporary = new File(openHouseGuideSnapshot.parentFile, "index.html.tmp")
            temporary.setText(html, "UTF-8")
            java.nio.file.Files.move(
                temporary.toPath(),
                openHouseGuideSnapshot.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING,
            )
        } catch (Exception error) {
            if (!openHouseGuideSnapshot.isFile() || openHouseGuideSnapshot.length() == 0L) throw error
            logger.warn("Unable to refresh the online guide; keeping the existing APK snapshot: ${error.message}")
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("syncOpenHouseGuideSnapshot")
}
