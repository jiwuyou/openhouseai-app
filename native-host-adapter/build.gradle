plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.openhouse.host.nativeapp"
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 28
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = "17" }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation project(":openhouse-core")
    implementation project(":openhouse-feature")
    implementation project(":service-control-feature")
    implementation project(":operit-feature")
    implementation project(":controlled-browser-feature")
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "androidx.test:core:1.6.1"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "org.json:json:20240303"
}
