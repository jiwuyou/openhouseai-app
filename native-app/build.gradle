plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.wuxianpi"
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.wuxianpi"
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 2
        versionName "0.2.0"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    packagingOptions {
        resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
        resources.excludes += ["/LICENSE-EDL-1.0.txt", "/LICENSE-EPL-1.0.txt"]
    }

    // The pairing server serves this exact filename and compressed byte stream from APK assets.
    androidResources {
        noCompress += ["tgz", "gz"]
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

def repoRoot = projectDir.parentFile
def nativeInstallAssets = file("src/main/assets/wuxianpi-install")

tasks.register("generateNativeInstallResources", Exec) {
    group = "build setup"
    description = "Generate the bundled WuxianPi installer, service-manager and runtime resources."
    inputs.file(new File(repoRoot, "scripts/generate-native-install-resources.sh"))
    inputs.dir(new File(repoRoot, "app/src/main/assets/smallphoneai/bootstrap"))
    inputs.files(
        new File(repoRoot, "app/src/main/assets/openhouse/product-payloads/manifest.json"),
        new File(repoRoot, "app/src/main/assets/openhouse/product-payloads/payload-manifest.json"),
        new File(repoRoot, "app/src/main/assets/openhouse/product-payloads/service-manager.tar"),
        new File(repoRoot, "app/src/main/assets/openhouse/product-payloads/pi-runtime.tar")
    )
    outputs.files(
        new File(nativeInstallAssets, "pre-tmux.sh"),
        new File(nativeInstallAssets, "resources.tar")
    )
    commandLine "bash", new File(repoRoot, "scripts/generate-native-install-resources.sh").absolutePath
}

tasks.named("preBuild").configure {
    dependsOn("generateNativeInstallResources")
}

tasks.register("verifyDebugRuntimeAsset") {
    group = "verification"
    description = "Verify the ARM64 runtime keeps its exact .tgz APK asset path and bytes."
    dependsOn("assembleDebug")
    doLast {
        def apk = fileTree("${buildDir}/outputs/apk/debug").matching { include("*.apk") }.singleFile
        def source = file("src/main/assets/openhouse-runtime/runtime-aarch64.tgz")
        def expectedPath = "assets/openhouse-runtime/runtime-aarch64.tgz"
        def archive = new java.util.zip.ZipFile(apk)
        try {
            def entry = archive.getEntry(expectedPath)
            if (entry == null) throw new GradleException("Missing exact APK asset ${expectedPath}")
            if (archive.getEntry("assets/openhouse-runtime/runtime-aarch64.tar") != null ||
                archive.getEntry("assets/openhouse-runtime/runtime-aarch64.tar.gz") != null) {
                throw new GradleException("APK contains a legacy expanded runtime asset name")
            }
            def digest = { stream ->
                def sha = java.security.MessageDigest.getInstance("SHA-256")
                stream.withCloseable { input ->
                    def buffer = new byte[8192]
                    for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                        if (read > 0) sha.update(buffer, 0, read)
                    }
                }
                sha.digest().encodeHex().toString()
            }
            def sourceSha = digest(source.newInputStream())
            def apkSha = digest(archive.getInputStream(entry))
            if (sourceSha != apkSha) {
                throw new GradleException("Runtime asset SHA-256 mismatch: source=${sourceSha}, apk=${apkSha}")
            }
            ["pre-tmux.sh", "resources.tar"].each { name ->
                def bundled = new File(nativeInstallAssets, name)
                def path = "assets/wuxianpi-install/${name}"
                def bundledEntry = archive.getEntry(path)
                if (bundledEntry == null) throw new GradleException("Missing exact APK asset ${path}")
                def bundledSha = digest(bundled.newInputStream())
                def apkBundledSha = digest(archive.getInputStream(bundledEntry))
                if (bundledSha != apkBundledSha) {
                    throw new GradleException("Native install asset SHA-256 mismatch: ${name}")
                }
            }
        } finally {
            archive.close()
        }
    }
}

dependencies {
    implementation project(":operit-feature")
    implementation project(":openhouse-core")
    implementation project(":openhouse-feature")
    implementation project(":service-control-feature")
    implementation project(":native-host-adapter")
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
