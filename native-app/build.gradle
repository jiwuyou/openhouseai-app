plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def canonicalVersionCode = rootProject.findProperty("openhouseVersionCode")?.toString()
def canonicalVersionName = rootProject.findProperty("openhouseVersionName")?.toString()
if (!canonicalVersionCode || !canonicalVersionName) {
    throw new GradleException("Missing canonical APK version in root gradle.properties")
}
def nativeVersionCode = (System.getenv("OPENHOUSE_APK_VERSION_CODE") ?: canonicalVersionCode).toInteger()
def nativeVersionName = (System.getenv("OPENHOUSE_APK_VERSION_NAME") ?: canonicalVersionName).toString()

android {
    namespace "com.wuxianpi"
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.wuxianpi"
        minSdkVersion 26
        targetSdkVersion 28
        versionCode nativeVersionCode
        versionName nativeVersionName
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        debug {
            storeFile file("../app/testkey_untrusted.jks")
            keyAlias "alias"
            storePassword "xrj45yWGLbsO7W0v"
            keyPassword "xrj45yWGLbsO7W0v"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    packagingOptions {
        resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
        resources.excludes += ["/LICENSE-EDL-1.0.txt", "/LICENSE-EPL-1.0.txt"]
    }

    // The pairing server serves this exact filename and compressed byte stream from APK assets.
    androidResources {
        noCompress += ["tgz", "gz", "tar"]
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

def repoRoot = projectDir.parentFile
def nativeInstallAssets = file("src/main/assets/wuxianpi-install")
def canonicalInstallAssets = new File(repoRoot, "app/src/main/assets/wuxianpi-install")

tasks.register("generateNativeInstallResources") {
    group = "build setup"
    description = "Generate the reproducible APK install bundle used by both Android hosts."
    dependsOn(rootProject.tasks.named("generateOpenHouseInstallBundle"))
}

tasks.named("preBuild").configure {
    dependsOn("generateNativeInstallResources")
}

tasks.register("verifyDebugResourceAssets") {
    group = "verification"
    description = "Verify the Native APK contains only the canonical single install bundle."
    dependsOn("assembleDebug")
    doLast {
        def apk = fileTree("${buildDir}/outputs/apk/debug").matching { include("*.apk") }.singleFile
        def archive = new java.util.zip.ZipFile(apk)
        try {
            def digest = { stream ->
                def sha = java.security.MessageDigest.getInstance("SHA-256")
                stream.withCloseable { input ->
                    def buffer = new byte[8192]
                    for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                        if (read > 0) sha.update(buffer, 0, read)
                    }
                }
                sha.digest().encodeHex().toString()
            }
            if (archive.getEntry("assets/openhouse-runtime/runtime-aarch64.tgz") != null) {
                throw new GradleException("APK contains the retired duplicate Native runtime asset")
            }
            if (archive.entries().find { it.name.startsWith("assets/openhouse-resources-v2/") } != null) {
                throw new GradleException("Native APK contains retired duplicate per-resource assets")
            }
            ["pre-tmux.sh", "openhouse-install-bundle.tar", "bundle-index.json"].each { name ->
                def bundled = new File(nativeInstallAssets, name)
                def path = "assets/wuxianpi-install/${name}"
                def bundledEntry = archive.getEntry(path)
                if (bundledEntry == null) throw new GradleException("Missing exact APK asset ${path}")
                def bundledSha = digest(bundled.newInputStream())
                def apkBundledSha = digest(archive.getInputStream(bundledEntry))
                if (bundledSha != apkBundledSha) {
                    throw new GradleException("Native install asset SHA-256 mismatch: ${name}")
                }
            }
        } finally {
            archive.close()
        }
    }
}

dependencies {
    implementation "com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava"
    implementation project(":operit-feature")
    implementation project(":openhouse-core")
    implementation project(":openhouse-feature")
    implementation project(":service-control-feature")
    implementation project(":native-host-adapter")
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
