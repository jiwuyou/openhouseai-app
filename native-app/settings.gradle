pluginManagement {
    plugins {
        id "com.android.application" version "8.13.2"
        id "com.android.library" version "8.13.2"
        id "org.jetbrains.kotlin.android" version "2.2.0"
        id "org.jetbrains.kotlin.plugin.compose" version "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "WuxianPiNative"
include ":ai-feature", ":pi-client", ":android-tool-bridge"
project(":ai-feature").projectDir = file("../ai-feature")
project(":pi-client").projectDir = file("../pi-client")
project(":android-tool-bridge").projectDir = file("../android-tool-bridge")
