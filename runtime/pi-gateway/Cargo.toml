[package]
name = "openhouse-pi-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Loopback-only process and transport gateway for pi_agent_rust RPC mode"

[lib]
name = "openhouse_pi_runtime"
path = "src/lib.rs"

[[bin]]
name = "openhouse-pi-runtime"
path = "src/main.rs"

[[bin]]
name = "fake-pi"
path = "src/bin/fake_pi.rs"
required-features = ["fake-pi"]

[features]
default = []
fake-pi = []

[dependencies]
axum = { version = "0.8.4", features = ["json", "ws"] }
base64 = "0.22.1"
clap = { version = "4.5.40", features = ["derive", "env"] }
futures-util = "0.3.31"
rand = "0.9.1"
reqwest = { version = "0.12.20", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
subtle = "2.6.1"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.15", features = ["rt"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
uuid = { version = "1.16.0", features = ["serde", "v4"] }
walkdir = "2.5.0"
zip = { version = "4.0.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.20.0"
tokio-tungstenite = "0.27.0"

[lints]
workspace = true
