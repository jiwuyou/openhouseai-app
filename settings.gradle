pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        maven { url = uri("${rootDir}/local-maven") }
        google()
        mavenCentral()
        maven { url = uri("https://jitpack.io") }
        maven { url = uri("https://api.xposed.info/") }
        maven { url = uri("https://oss.sonatype.org/content/repositories/snapshots") }
    }
}

include ':app', ':termux-shared', ':terminal-emulator', ':terminal-view'
include ':pi-client', ':ai-feature', ':native-app'
include ':operit-feature'
include ':remote-assist-protocol', ':assist-app'
include ':openhouse-core', ':openhouse-feature', ':service-control-feature'
include ':termux-host-adapter', ':native-host-adapter'
include ':operit-dragonbones', ':operit-mnn', ':operit-llama', ':operit-mmd'
include ':operit-fbx', ':operit-quickjs', ':operit-showerclient'
