buildscript {
    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.2.0"
        classpath "org.jetbrains.kotlin:kotlin-serialization:2.2.0"
        classpath "io.objectbox:objectbox-gradle-plugin:5.3.0"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://api.xposed.info/" }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
    }

    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.google.guava" && details.requested.name == "guava") {
                details.useVersion "31.1-jre"
                details.because "Termux file deletion uses Guava JRE MoreFiles APIs that are absent from guava-android."
            }
        }
    }
}
