def sharedRescueRustLibrary =
    file("src/main/jniLibs/arm64-v8a/libwuxianpi_rescue.so")
def repositoryDir = file("${projectDir}/..")
def buildingNativeHost = gradle.startParameter.taskNames.any {
    it == "assembleDebug" || it == "assembleRelease" || it.contains(":native-app:")
}

tasks.register("buildSharedPiRustAndroid", Exec) {
    group = "build"
    description = "Build the shared Android-local WuxianPi rescue runtime."
    workingDir repositoryDir
    commandLine "bash", file("${repositoryDir}/scripts/build-pi-rust-android.sh").absolutePath
    inputs.dir file("${repositoryDir}/rust/pi-android-bridge/src")
    inputs.dir file("${repositoryDir}/rust/vendor/pi_agent_rust/src")
    inputs.files(
        file("${repositoryDir}/rust/pi-android-bridge/Cargo.toml"),
        file("${repositoryDir}/rust/pi-android-bridge/Cargo.lock"),
        file("${repositoryDir}/rust/vendor/pi_agent_rust/Cargo.toml"),
        file("${repositoryDir}/rust/vendor/pi_agent_rust/Cargo.lock"),
        file("${repositoryDir}/scripts/build-pi-rust-android.sh"),
    )
    outputs.file sharedRescueRustLibrary
}

// native-app already invokes the same script; every other host gets the shared JNI automatically.
if (!buildingNativeHost) {
    tasks.named("preBuild").configure { dependsOn("buildSharedPiRustAndroid") }
}
