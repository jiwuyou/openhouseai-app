name: Attach Debug APKs To Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  attach-apks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: [all-in-one, native]

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Debug distribution
        env:
          OPENHOUSE_PRODUCT_BASELINE_REF: HEAD
          SKIP_RUNTIME_BUILD: '1'
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '1'
          TERMUX_APK_VERSION_TAG: ${{ github.event.release.tag_name }}-github-debug
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.product }}" in
            all-in-one)
              ./scripts/build-all-in-one.sh
              ;;
            native)
              ./scripts/build-native.sh
              ;;
            *)
              printf 'Unknown product: %s\n' "${{ matrix.product }}" >&2
              exit 2
              ;;
          esac

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ matrix.product }}" == all-in-one ]]; then
            cp app/build/outputs/apk/debug/*arm64-v8a.apk dist/openhouse-all-in-one-debug-arm64-v8a.apk
            cp app/build/outputs/apk/debug/*_universal.apk dist/openhouse-all-in-one-debug-universal.apk
          else
            cp native-app/build/outputs/apk/debug/*.apk dist/openhouse-native-debug-arm64-v8a.apk
          fi

      - name: Upload Debug APKs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openhouse-${{ matrix.product }}-debug-apks
          if-no-files-found: error
          path: dist/*.apk

  publish-checksums:
    needs: attach-apks
    runs-on: ubuntu-latest
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v8
        with:
          pattern: openhouse-*-debug-apks
          path: dist
          merge-multiple: true

      - name: Generate combined checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(dist/*.apk)
          [[ "${#apks[@]}" -eq 3 ]] || {
            printf 'Expected three Debug APKs, found %s\n' "${#apks[@]}" >&2
            exit 1
          }
          (cd dist && sha256sum *.apk > SHA256SUMS)

      - name: Upload combined checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" dist/SHA256SUMS --clobber
