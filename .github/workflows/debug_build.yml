name: Debug Distribution Build

on:
  push:
    branches:
      - master
      - 'github-releases/**'
      - feature/wuxianpi-ai-web-ui
  pull_request:
    branches:
      - master
      - feature/wuxianpi-ai-web-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: [all-in-one, native]

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Debug distribution
        env:
          OPENHOUSE_PRODUCT_BASELINE_REF: HEAD
          SKIP_RUNTIME_BUILD: '1'
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '1'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.product }}" in
            all-in-one)
              ./scripts/build-all-in-one.sh
              ;;
            native)
              ./scripts/build-native.sh
              ;;
            *)
              printf 'Unknown product: %s\n' "${{ matrix.product }}" >&2
              exit 2
              ;;
          esac

      - name: Upload All-in-One Debug artifacts
        if: matrix.product == 'all-in-one'
        uses: actions/upload-artifact@v4
        with:
          name: openhouse-all-in-one-debug
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*arm64-v8a.apk
            app/build/outputs/apk/debug/*_universal.apk
            build/reports/apk-build/*

      - name: Upload Native Debug artifacts
        if: matrix.product == 'native'
        uses: actions/upload-artifact@v4
        with:
          name: openhouse-native-debug
          if-no-files-found: error
          path: |
            native-app/build/outputs/apk/debug/*.apk
            build/reports/apk-build/*
